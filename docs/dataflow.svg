<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470"
     role="img" aria-label="Data flow: only a tab's title and sanitized URL cross the network to Jev; recency, tab flags and all thresholds stay in the browser, where the decision is made.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#18181b"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/>
    </marker>
  </defs>

  <!-- Carries its own ground so it reads on any page background. -->
  <rect width="920" height="470" rx="10" fill="#fcfcfb"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" fill="#18181b">

    <!-- the boundary the whole diagram is about -->
    <line x1="606" y1="26" x2="606" y2="404" stroke="#2a78d6" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="598" y="40" font-size="12" font-weight="600" text-anchor="end" fill="#2a78d6">your browser</text>
    <text x="614" y="40" font-size="12" font-weight="600" fill="#2a78d6">api.typesafe.ai</text>

    <!-- ── top lane: the only path that leaves the machine ── -->
    <rect x="24" y="72" width="150" height="62" rx="7" fill="none" stroke="#18181b" stroke-width="1.2"/>
    <text x="99" y="97" font-size="13" text-anchor="middle" font-weight="600">Open tabs</text>
    <text x="99" y="115" font-size="11" text-anchor="middle" fill="#52514e">chrome.tabs.query()</text>

    <line x1="174" y1="103" x2="212" y2="103" stroke="#18181b" stroke-width="1.4" marker-end="url(#a)"/>

    <rect x="214" y="72" width="152" height="62" rx="7" fill="none" stroke="#18181b" stroke-width="1.2"/>
    <text x="290" y="97" font-size="13" text-anchor="middle" font-weight="600">sanitize</text>
    <text x="290" y="115" font-size="11" text-anchor="middle" fill="#52514e">drop ?query #frag /token</text>

    <line x1="366" y1="103" x2="404" y2="103" stroke="#18181b" stroke-width="1.4" marker-end="url(#a)"/>

    <rect x="406" y="72" width="164" height="62" rx="7" fill="none" stroke="#18181b" stroke-width="1.2"/>
    <text x="488" y="97" font-size="13" text-anchor="middle" font-weight="600">judgment cache</text>
    <text x="488" y="115" font-size="11" text-anchor="middle" fill="#52514e">keyed on {title, url}</text>

    <!-- the crossing, and what it costs -->
    <line x1="570" y1="92" x2="676" y2="92" stroke="#2a78d6" stroke-width="1.8" marker-end="url(#ab)"/>
    <text x="588" y="70" font-size="11" text-anchor="end" fill="#2a78d6" font-weight="600">on a cache miss</text>

    <line x1="676" y1="122" x2="570" y2="122" stroke="#2a78d6" stroke-width="1.8" marker-end="url(#ab)"/>
    <text x="612" y="162" font-size="11" text-anchor="start" fill="#2a78d6">5 probabilities per tab</text>

    <rect x="678" y="64" width="216" height="78" rx="7" fill="none" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="786" y="90" font-size="13" text-anchor="middle" font-weight="600" fill="#2a78d6">Jev</text>
    <text x="786" y="108" font-size="11" text-anchor="middle" fill="#52514e">state: [{title, url}] ×8</text>
    <text x="786" y="124" font-size="11" text-anchor="middle" fill="#52514e">questions: 5 nouls × 8</text>

    <!-- ── what never leaves ── -->
    <rect x="24" y="232" width="342" height="86" rx="7" fill="none" stroke="#18181b" stroke-width="1.2"/>
    <text x="195" y="256" font-size="13" text-anchor="middle" font-weight="600">never sent</text>
    <text x="195" y="276" font-size="11" text-anchor="middle" fill="#52514e">lastAccessed · firstSeen · pinned · audible</text>
    <text x="195" y="292" font-size="11" text-anchor="middle" fill="#52514e">active · windowTabCount · host · denylist</text>
    <text x="195" y="308" font-size="11" text-anchor="middle" fill="#52514e">every threshold · your feedback labels</text>

    <line x1="366" y1="275" x2="404" y2="275" stroke="#18181b" stroke-width="1.4" marker-end="url(#a)"/>

    <!-- cache feeds the decision -->
    <line x1="488" y1="134" x2="488" y2="230" stroke="#18181b" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="498" y="185" font-size="11" fill="#52514e">facet values</text>

    <rect x="406" y="232" width="164" height="86" rx="7" fill="none" stroke="#18181b" stroke-width="1.2"/>
    <text x="488" y="262" font-size="13" text-anchor="middle" font-weight="600">decide()</text>
    <text x="488" y="281" font-size="11" text-anchor="middle" fill="#52514e">pure · no network</text>
    <text x="488" y="297" font-size="11" text-anchor="middle" fill="#52514e">hard skips, then gates</text>

    <line x1="488" y1="318" x2="488" y2="356" stroke="#18181b" stroke-width="1.4" marker-end="url(#a)"/>

    <rect x="406" y="358" width="164" height="56" rx="7" fill="none" stroke="#18181b" stroke-width="1.2"/>
    <text x="488" y="381" font-size="13" text-anchor="middle" font-weight="600">close / keep</text>
    <text x="488" y="399" font-size="11" text-anchor="middle" fill="#52514e">archive, then remove</text>

    <!-- the loop that makes retuning free -->
    <path d="M406,386 L120,386 L120,326" fill="none" stroke="#18181b" stroke-width="1.2"
          stroke-dasharray="4 3" marker-end="url(#a)"/>
    <text x="134" y="352" font-size="11" fill="#52514e">your corrections tune the gates</text>

    <text x="24" y="444" font-size="11" fill="#52514e">A tab is judged once. Changing a threshold re-runs only the right-hand column — no request, no cost.</text>
  </g>
</svg>
